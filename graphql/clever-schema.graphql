}

"""Custom extension fields on a course record."""
type CourseExt {
  [key: String]: String
}

"""Association between a course and a term."""
type CourseTerm {
  courseId: ID!
  termId: ID!
  schoolId: ID
}

type CourseConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [CourseEdge]
}

type CourseEdge {
  cursor: String!
