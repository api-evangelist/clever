  createdAt: String
  updatedAt: String
}

"""Core metadata about a section."""
type SectionDetails {
  sisId: String
  name: String
  subject: String
  description: String
  grade: String
  period: String
  sequence: Int
  ssisId: String
  courseNumber: String
  ext: SectionExt
}

"""Custom extension fields on a section record."""
type SectionExt {
  [key: String]: String
}

type SectionConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [SectionEdge]
}

type SectionEdge {
  cursor: String!
  node: Section
