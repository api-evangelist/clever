"""
Clever GraphQL API Schema
Endpoint: https://api.clever.com/v3.0/graphql
Authentication: OAuth 2.0 Bearer token (district-app token or user token)
"""

schema {
  query: Query
}

# ─────────────────────────────────────────────
# Root Query
# ─────────────────────────────────────────────

type Query {
  """Fetch a single district by ID."""
  district(id: ID!): District

  """List all districts the authenticated application has access to."""
  districts(first: Int, after: String, last: Int, before: String): DistrictConnection

  """Fetch a single school by ID."""
  school(id: ID!): School

  """List schools, optionally filtered by district."""
  schools(districtId: ID, first: Int, after: String): SchoolConnection

  """Fetch a single student by ID."""
  student(id: ID!): Student

  """List students, optionally filtered by district or school."""
  students(districtId: ID, schoolId: ID, first: Int, after: String): StudentConnection

  """Fetch a single teacher by ID."""
  teacher(id: ID!): Teacher

  """List teachers, optionally filtered by district or school."""
  teachers(districtId: ID, schoolId: ID, first: Int, after: String): TeacherConnection

  """Fetch a single staff member by ID."""
  staffMember(id: ID!): Staff

  """List staff members, optionally filtered by district or school."""
  staff(districtId: ID, schoolId: ID, first: Int, after: String): StaffConnection

  """Fetch a single section by ID."""
  section(id: ID!): Section

  """List sections, optionally filtered by district, school, or term."""
  sections(districtId: ID, schoolId: ID, termId: ID, first: Int, after: String): SectionConnection

  """Fetch a single course by ID."""
  course(id: ID!): Course

  """List courses, optionally filtered by district."""
  courses(districtId: ID, first: Int, after: String): CourseConnection

  """Fetch a single term by ID."""
  term(id: ID!): Term

  """List terms, optionally filtered by district or school."""
  terms(districtId: ID, schoolId: ID, first: Int, after: String): TermConnection

  """Fetch a single contact by ID."""
  contact(id: ID!): Contact

  """List contacts for a student."""
  contacts(studentId: ID!, first: Int, after: String): ContactConnection

  """Fetch identity record for the authenticated user (requires user token)."""
  me: Identity

  """Fetch identity by Clever user ID."""
  identity(id: ID!): Identity

  """List event stream for a district since a given timestamp or cursor."""
  districtEvents(districtId: ID!, since: String, first: Int, after: String): DistrictEventConnection

  """Fetch an application by ID."""
  application(id: ID!): Application

  """List applications the authenticated context has access to."""
  applications(first: Int, after: String): ApplicationConnection

  """Fetch data sync status for a district."""
  dataSync(districtId: ID!): DataSync
}

# ─────────────────────────────────────────────
# Pagination
# ─────────────────────────────────────────────

"""Cursor-based pagination metadata."""
type PageInfo {
  """Whether more results exist after this page."""
  hasNextPage: Boolean!

  """Whether more results exist before this page."""
  hasPreviousPage: Boolean!

  """Cursor for the first item in this page."""
  startCursor: String

  """Cursor for the last item in this page."""
  endCursor: String
}

"""Generic connection wrapper for paginated lists."""
type Connection {
  pageInfo: PageInfo!
  totalCount: Int
}

"""Generic edge in a paginated connection."""
type Edge {
  cursor: String!
}

# ─────────────────────────────────────────────
# District
# ─────────────────────────────────────────────

"""A school district in the Clever platform."""
type District {
  id: ID!
  name: String!
  details: DistrictDetails
  status: DistrictStatus
  admins: DistrictAdminConnection
  schools(first: Int, after: String): SchoolConnection
  students(first: Int, after: String): StudentConnection
  teachers(first: Int, after: String): TeacherConnection
  staff(first: Int, after: String): StaffConnection
  sections(first: Int, after: String): SectionConnection
  courses(first: Int, after: String): CourseConnection
  terms(first: Int, after: String): TermConnection
  createdAt: String
  updatedAt: String
}

"""Extended metadata for a district."""
type DistrictDetails {
  mdrNumber: String
  ncessId: String
  state: String
  loginMethods: [String]
  launchDate: String
  pauseStart: String
  pauseEnd: String
  error: String
}

"""Status of a district's data sync with Clever."""
type DistrictStatus {
  type: String
  lastSync: String
  syncEnabled: Boolean
  error: String
}

"""A district-level administrator account."""
type DistrictAdmin {
  id: ID!
  districtId: ID!
  name: DistrictAdminName
  email: String
  title: String
  createdAt: String
  updatedAt: String
}

"""Name components for a district admin."""
type DistrictAdminName {
  first: String
  last: String
}

"""A district-level event from the event stream."""
type DistrictEvent {
  id: ID!
  districtId: ID!
  type: EventType!
  data: EventData
  createdAt: String
}

type DistrictAdminConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [DistrictAdminEdge]
}

type DistrictAdminEdge {
  cursor: String!
  node: DistrictAdmin
}

type DistrictConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [DistrictEdge]
}

type DistrictEdge {
  cursor: String!
  node: District
}

type DistrictEventConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [DistrictEventEdge]
}

type DistrictEventEdge {
  cursor: String!
  node: DistrictEvent
}

# ─────────────────────────────────────────────
# School
# ─────────────────────────────────────────────

"""A school within a district."""
type School {
  id: ID!
  districtId: ID!
  name: String!
  details: SchoolDetails
  admins: SchoolAdminConnection
  students(first: Int, after: String): StudentConnection
  teachers(first: Int, after: String): TeacherConnection
  staff(first: Int, after: String): StaffConnection
  sections(first: Int, after: String): SectionConnection
  terms(first: Int, after: String): TermConnection
  createdAt: String
  updatedAt: String
}

"""Extended metadata for a school."""
type SchoolDetails {
  sisId: String
  ncessId: String
  stateId: String
  name: String
  phone: String
  principalName: String
  principalEmail: String
  schoolNumber: String
  mdrNumber: String
  lowGrade: String
  highGrade: String
  location: SchoolLocation
  subtype: String
  created: String
  ext: SchoolExt
}

"""Geographic location of a school."""
type SchoolLocation {
  address: String
  city: String
  state: String
  zip: String
}

"""Custom extension fields on a school record."""
type SchoolExt {
  [key: String]: String
}

"""A school-level administrator."""
type SchoolAdmin {
  id: ID!
  schoolId: ID!
  name: AdminName
  email: String
  title: String
  staffId: String
  createdAt: String
  updatedAt: String
}

"""Shared name structure for admins."""
type AdminName {
  first: String
  last: String
}

type SchoolConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [SchoolEdge]
}

type SchoolEdge {
  cursor: String!
  node: School
}

type SchoolAdminConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [SchoolAdminEdge]
}

type SchoolAdminEdge {
  cursor: String!
  node: SchoolAdmin
}

# ─────────────────────────────────────────────
# Student
# ─────────────────────────────────────────────

"""A K-12 student record."""
type Student {
  id: ID!
  districtId: ID!
  details: StudentDetails
  demographics: StudentDemographics
  contacts(first: Int, after: String): ContactConnection
  enrollments(first: Int, after: String): StudentEnrollmentConnection
  schools(first: Int, after: String): SchoolConnection
  sections(first: Int, after: String): SectionConnection
  createdAt: String
  updatedAt: String
}

"""Core personal and academic details for a student."""
type StudentDetails {
  sisId: String
  stateId: String
  studentNumber: String
  name: StudentName
  email: String
  emailVerified: Boolean
  username: String
  grade: String
  graduationYear: String
  dob: String
  gender: String
  location: StudentLocation
  ext: StudentExt
}

"""Name components for a student."""
type StudentName {
  first: String
  middle: String
  last: String
}

"""Home address for a student."""
type StudentLocation {
  address: String
  city: String
  state: String
  zip: String
}

"""Custom extension fields on a student record."""
type StudentExt {
  [key: String]: String
}

"""Demographic data associated with a student."""
type StudentDemographics {
  race: [StudentRace]
  hispanicEthnicity: String
  gender: String
  ellStatus: String
  iepStatus: String
  frlStatus: String
  migrantStatus: Boolean
  homelessStatus: Boolean
  militaryConnected: String
}

"""Individual race entry on a student demographic record."""
type StudentRace {
  race: String
}

"""A student's enrollment in a specific school for a term."""
type StudentEnrollment {
  schoolId: ID!
  startDate: String
  endDate: String
  grade: String
}

type StudentConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [StudentEdge]
}

type StudentEdge {
  cursor: String!
  node: Student
}

type StudentEnrollmentConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [StudentEnrollmentEdge]
}

type StudentEnrollmentEdge {
  cursor: String!
  node: StudentEnrollment
}

