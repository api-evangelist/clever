# ─────────────────────────────────────────────
# Contact
# ─────────────────────────────────────────────

"""A parent, guardian, or emergency contact linked to a student."""
type Contact {
  id: ID!
  districtId: ID!
  details: ContactDetails
  relationships: [ContactRelationship]
  type: ContactType
  createdAt: String
  updatedAt: String
}

"""Personal details for a contact."""
type ContactDetails {
  sisId: String
  name: ContactName
  email: String
  phone: String
  phoneType: String
  address: ContactAddress
  ext: ContactExt
}

"""Name components for a contact."""
type ContactName {
  first: String
  last: String
}

"""Address for a contact."""
type ContactAddress {
  address: String
  city: String
  state: String
  zip: String
}

"""Custom extension fields on a contact record."""
type ContactExt {
  [key: String]: String
}

"""Relationship between a contact and a student."""
type ContactRelationship {
  studentId: ID!
  relationship: String
  phone: String
  phoneType: String
  smsOptIn: Boolean
  emailOptIn: Boolean
  portalLoginEmail: String
  seq: Int
}

"""Classification of a contact (guardian, parent, emergency, etc.)."""
type ContactType {
  category: String
  legal: Boolean
  emergency: Boolean
  pickup: Boolean
}

type ContactConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [ContactEdge]
}

type ContactEdge {
  cursor: String!
  node: Contact
}

# ─────────────────────────────────────────────
# Events
# ─────────────────────────────────────────────

"""A roster change event from the Clever Events API."""
type Event {
  id: ID!
  districtId: ID!
  type: EventType!
  data: EventData
  createdAt: String
}

"""Payload of an event describing what changed."""
type EventData {
  object: String
  objectId: ID
  delta: [EventDelta]
}

"""A field-level delta within an event."""
type EventDelta {
  key: String!
  previousValue: String
  currentValue: String
}

"""Types of roster change events."""
enum EventType {
  CREATED
  UPDATED
  DELETED
}

# ─────────────────────────────────────────────
# Identity and SSO
# ─────────────────────────────────────────────

"""Unified identity record for a Clever user."""
type Identity {
  id: ID!
  districtId: ID!
  details: IdentityDetails
  sso: SSO
  roles: [String]
  createdAt: String
  updatedAt: String
}

"""Personal details embedded in an identity record."""
type IdentityDetails {
  name: IdentityName
  email: String
  district: String
  type: String
  credentials: IdentityCredentials
  authorized_by: String
}

"""Name components in an identity record."""
type IdentityName {
  first: String
  last: String
}

"""Credential information in an identity record."""
type IdentityCredentials {
  districtUsername: String
}

"""Single sign-on configuration for an application-district pair."""
type SSO {
  id: ID!
  applicationId: ID!
  districtId: ID!
  enabled: Boolean
  loginMethod: String
  badges: Boolean
  cleverId: Boolean
  tokens: [SSOToken]
}

"""OAuth token bundle issued after an SSO flow completes."""
type SSOToken {
  accessToken: String!
  tokenType: String
  expiresIn: Int
  scope: String
  idToken: String
}

"""OAuth 2.0 authorization metadata."""
type OAuth {
  clientId: String
  redirectUri: String
  responseType: String
  scope: String
  state: String
  district: String
}

# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────

"""A Clever application (partner app) descriptor."""
type Application {
  id: ID!
  details: AppDetails
  districts(first: Int, after: String): AppDistrictConnection
  rostering: Rostering
  createdAt: String
  updatedAt: String
}

"""Details about a Clever application."""
type AppDetails {
  name: String
  description: String
  iconUri: String
  bannerUri: String
  websiteUri: String
  privacyPolicyUri: String
  supportEmail: String
  vendorId: String
  assistiveSchoolsEnabled: Boolean
  assistiveStudentsEnabled: Boolean
}

"""The relationship between an application and a district."""
type AppDistrict {
  id: ID!
  applicationId: ID!
  districtId: ID!
  state: String
  sharingStartedAt: String
  credentials: AppDistrictCredentials
}

"""Credentials used by an application within a specific district context."""
type AppDistrictCredentials {
  authorizedBy: String
  districtUsername: String
}

type ApplicationConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [ApplicationEdge]
}

type ApplicationEdge {
  cursor: String!
  node: Application
}

type AppDistrictConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [AppDistrictEdge]
}

type AppDistrictEdge {
  cursor: String!
  node: AppDistrict
}

# ─────────────────────────────────────────────
# Rostering and Data Sync
# ─────────────────────────────────────────────

"""Rostering configuration for an application."""
type Rostering {
  enabled: Boolean
  method: String
  lastSync: String
  syncFrequency: String
}

"""A data synchronization job for a district."""
type DataSync {
  districtId: ID!
  details: SyncDetails
  status: SyncStatus
  history(first: Int, after: String): SyncHistoryConnection
}

"""Details about a data sync configuration."""
type SyncDetails {
  sisType: String
  sftp: SyncSFTP
  lastSync: String
  nextSync: String
  scheduleEnabled: Boolean
}

"""SFTP configuration for a district SIS data sync."""
type SyncSFTP {
  host: String
  port: Int
  username: String
  path: String
}

"""Current status of a district data sync."""
type SyncStatus {
  state: SyncState
  error: String
  startedAt: String
  completedAt: String
  studentsAdded: Int
  studentsModified: Int
  studentsDeleted: Int
  teachersAdded: Int
  teachersModified: Int
  teachersDeleted: Int
  sectionsAdded: Int
  sectionsModified: Int
  sectionsDeleted: Int
}

"""State of a data sync job."""
enum SyncState {
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
}

"""A historical sync run record."""
type SyncHistoryEntry {
  syncId: ID!
  districtId: ID!
  status: SyncStatus
  startedAt: String
  completedAt: String
}

type SyncHistoryConnection {
  pageInfo: PageInfo!
  totalCount: Int
  edges: [SyncHistoryEdge]
}

type SyncHistoryEdge {
  cursor: String!
  node: SyncHistoryEntry
}

# ─────────────────────────────────────────────
# Change Events (Delta Sync)
# ─────────────────────────────────────────────

"""A change event representing a field-level delta on a resource."""
type ChangeEvent {
  id: ID!
  districtId: ID!
  type: EventType!
  objectType: String
  objectId: ID!
  delta: [EventDelta]
  createdAt: String
}

# ─────────────────────────────────────────────
# Resources and API Keys
# ─────────────────────────────────────────────

"""A collection of resources accessible under a given context."""
type Resources {
  students: StudentConnection
  teachers: TeacherConnection
  staff: StaffConnection
  schools: SchoolConnection
  sections: SectionConnection
  courses: CourseConnection
  terms: TermConnection
  contacts: ContactConnection
}

"""An API key associated with an application or district context."""
type APIKey {
  id: ID!
  applicationId: ID
  districtId: ID
  keyPrefix: String
  createdAt: String
  expiresAt: String
  scopes: [String]
}

"""A bearer token with associated metadata."""
type Token {
  accessToken: String!
  tokenType: String
  expiresIn: Int
  scope: String
  createdAt: String
}
