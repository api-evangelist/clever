openapi: 3.2.0
info:
  description: Serves the Clever Data API
  title: Data School Admins API
  version: 1.2.0
servers:
- url: https://api.clever.com/v1.2
security:
- oauth: []
tags:
- name: School Admins
paths:
  /school_admins:
    get:
      description: Returns a list of school admins
      operationId: getSchoolAdmins
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: starting_after
        schema:
          type: string
      - in: query
        name: ending_before
        schema:
          type: string
      - in: query
        name: where
        schema:
          type: string
      responses:
        '200':
          description: OK Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolAdminsResponse'
      tags:
      - School Admins
      summary: Get school admins
      x-summary-source: derived
  /school_admins/{id}:
    get:
      description: Returns a specific school admin
      operationId: getSchoolAdmin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: include
        schema:
          type: string
      responses:
        '200':
          description: OK Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolAdminResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - School Admins
      summary: Get school admin
      x-summary-source: derived
  /school_admins/{id}/schools:
    get:
      description: Returns the schools for a school admin
      operationId: getSchoolsForSchoolAdmin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: starting_after
        schema:
          type: string
      - in: query
        name: ending_before
        schema:
          type: string
      responses:
        '200':
          description: OK Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - School Admins
      summary: Get schools for school admin
      x-summary-source: derived
