apis:
- name: Clever Single Sign-On API
  description: >-
    OAuth 2.0, OIDC, and SAML-based single sign-on integration that enables application partners to authenticate
    students, teachers, and staff through the Clever portal. Issues bearer access tokens scoped to individual
    users for identity and profile data access.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.clever.com/docs/integration-types
  baseURL: https://clever.com/oauth
  tags:
  - Single Sign-On
  - OAuth
  - OIDC
  - SAML
  - Authentication
  - Identity
  properties:
  - type: Documentation
    url: https://dev.clever.com/docs/integration-types
- name: Clever Events API
  description: >-
    Delta-sync event stream API that notifies application partners of changes to roster data (creates,
    updates, deletes) within a district. Must be enabled via the application dashboard and uses a district-app
    token for access, enabling efficient incremental data synchronization.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.clever.com/docs/api-overview
  baseURL: https://api.clever.com/v3.1
  tags:
