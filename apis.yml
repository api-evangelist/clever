aid: clever
name: Clever
description: Clever is a K-12 EdTech identity platform that provides a unified single
  sign-on portal and roster synchronization service used by over 111,000 US schools,
  including 95 of the largest 100 districts. The Clever REST API enables application
  partners to securely access real-time student roster data, school and district information,
  class and section data, and user identity records through a single integration.
  Clever Complete offers Secure Sync for district-managed rostering, LMS Connect for
  gradebook syncing, and Single Sign-On via OAuth 2.0, OIDC, and SAML, eliminating
  the need for per-SIS integrations. Approximately 60 percent of US students log in
  monthly through Clever, making it the de facto identity layer for K-12 EdTech applications
  across the United States.
