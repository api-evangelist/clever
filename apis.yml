apis:
- name: Clever Data API
  description: RESTful API providing access to district, school, student, teacher,
    section, and course data synchronized from Student Information Systems. Supports
    delta sync via Events API and requires a district-app token for authentication.
    Current version is v3.1.
  image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://dev.clever.com/docs/api-overview
  baseURL: https://api.clever.com
  tags:
  - Rostering
  - Student Data
  - Districts
  - Schools
  - Sections
  - Courses
  properties:
  - type: Documentation
    url: https://dev.clever.com/docs/api-overview
  - type: OpenAPI
    url: openapi/clever-data-api-openapi.yml
  - url: graphql/clever-graphql.md
    type: GraphQL
- name: Clever Single Sign-On API
  description: OAuth 2.0, OIDC, and SAML-based single sign-on integration that enables
    application partners to authenticate students, teachers, and staff through the
    Clever portal. Issues bearer access tokens scoped to individual users for identity
    and profile data access.
  image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://dev.clever.com/docs/integration-types
  baseURL: https://clever.com/oauth
  tags:
  - Single Sign-On
  - OAuth
  - OIDC
  - SAML
  - Authentication
  - Identity
  properties:
  - type: Documentation
    url: https://dev.clever.com/docs/integration-types
- name: Clever LMS Connect API
  description: Integration layer allowing Learning Management Systems to sync gradebook
    data, assignments, and course enrollments with Clever. Available as of API v3.1,
    enabling LMS partners to exchange academic progress data in real time with districts
    using Clever.
  image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://dev.clever.com/docs/integration-types
  baseURL: https://api.clever.com/v3.1
  tags:
  - LMS
  - Gradebook
  - Assignments
  - Courses
  - Learning Management
  properties:
  - type: Documentation
    url: https://dev.clever.com/docs/integration-types
  - type: OpenAPI
    url: openapi/clever-lms-connect-api-openapi.yml
- name: Clever Events API
  description: Delta-sync event stream API that notifies application partners of changes
    to roster data (creates, updates, deletes) within a district. Must be enabled
    via the application dashboard and uses a district-app token for access, enabling
    efficient incremental data synchronization.
  image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://dev.clever.com/docs/api-overview
  baseURL: https://api.clever.com/v3.1
  tags:
  - Events
  - Delta Sync
  - Webhooks
  - Rostering
  properties:
  - type: Documentation
    url: https://dev.clever.com/docs/api-overview
  - type: OpenAPI
    url: openapi/clever-events-api-openapi.yml
